# Construit l'APK de l'app enfant sur les serveurs GitHub (gratuit).
# Se lance à chaque "push" et peut aussi être déclenché à la main (onglet Actions → Run workflow).
# Résultat : l'APK téléchargeable dans l'onglet Actions → le run → "Artifacts" → app-debug-apk.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pas besoin d'installer le SDK Android : il est déjà présent sur les
      # serveurs GitHub (ANDROID_HOME/ANDROID_SDK_ROOT pointent dessus, licences
      # déjà acceptées). On évite ainsi l'étape "setup-android" qui échouait.
      - name: Vérifier le SDK Android présent
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK (debug)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
